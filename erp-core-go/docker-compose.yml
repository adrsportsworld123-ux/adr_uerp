version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d   # on a genuinely fresh volume only, Postgres's entrypoint runs
                                                    # EVERY .sql file here in filename order — all of them, not just
                                                    # 001_schema.sql/002_seed.sql as this comment used to (wrongly)
                                                    # claim. Confirmed live (2026-09-24): the pgdata volume was reset
                                                    # at some point outside this session's control, and the next
                                                    # `docker compose up` silently replayed migrations 001 through
                                                    # the latest, restoring schema + every migration's own seed/
                                                    # backfill INSERTs correctly — but not any runtime data created
                                                    # via the API afterward (real orders, payroll runs, e-invoices,
                                                    # extra employees), which a fresh volume has no way to recreate.
                                                    # If dev data vanishes unexpectedly, check `docker inspect
                                                    # erp-core-go-postgres-1 --format '{{.State.StartedAt}}'` against
                                                    # when you'd expect the volume to have persisted — a suspiciously
                                                    # recent start time is the tell.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    environment:
      - discovery.type=single-node
      # Local dev only — matches DEV_AUTH_TOOLS_ENABLED's philosophy below:
      # this compose file IS the dev environment, so the security plugin
      # (TLS, auth, initial admin password) is disabled rather than fought.
      # Never carry plugins.security.disabled=true into a real deployment.
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # 2.12+'s demo-config installer refuses to start without this set,
      # even though plugins.security.disabled=true means it's never
      # actually checked on any request — dev-only value, unused in practice.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Dev-Only-Passw0rd!
    ports:
      - "9200:9200"
    volumes:
      # Without this, every container recreation (an image rebuild, `docker
      # compose down`, `--force-recreate`, host reboot) starts OpenSearch
      # as a brand-new empty node — the products index gets recreated by
      # EnsureIndex on the next API boot, but with zero documents, so
      # search silently returns nothing until someone thinks to run
      # POST /search/reindex. Found live: exactly this happened after an
      # unrelated `api` container recreate outlived a separate opensearch
      # restart. main.go's startup backfill (search.BackfillAllTenants)
      # now covers the case where this volume is lost anyway, but keeping
      # the index warm across ordinary restarts is still the right default.
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Self-hosted LLM backend for internal/ai/llm.OllamaClient — powers
  # POST /ai/ask (NLP-BI) and POST /ai/copilot/chat when LLM_PROVIDER=ollama
  # below. No API key, no data leaves this docker network. The image ships
  # with no model preloaded — after `docker compose up`, pull one once:
  #   docker compose exec ollama ollama pull llama3.2:3b
  # (or whatever OLLAMA_MODEL is set to). The api service does NOT
  # depends_on this with a health condition: an LLM backend that isn't
  # ready yet is a per-request 502/503 on the two AI endpoints that need
  # it, never a reason the rest of the API should fail to start — same
  # posture as OPENSEARCH_URL being optional, just without a startup
  # backfill step to wait for.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      # erp_app, NOT app_user/POSTGRES_USER — app_user is a Postgres
      # superuser (that's what POSTGRES_USER always gets on the official
      # postgres image), and superusers unconditionally bypass row-level
      # security. The API must run as the restricted role migrations/004
      # creates, or every RLS policy in this schema is dead weight — see
      # that migration's header comment for how this was actually found
      # and confirmed live, not just reasoned about.
      DATABASE_DSN: "postgres://erp_app:erp_app_password@postgres:5432/erp?sslmode=disable"
      OPENSEARCH_URL: "http://opensearch:9200"
      JWT_SECRET: "dev-only-secret-change-me"
      # Enables POST /dev/hash-password and POST /dev/set-password — see
      # internal/authn/dev_handlers.go. On by default here because this
      # compose file IS your local dev environment. Delete this line (or
      # set it to "false") in any compose/deployment file that isn't
      # running solely on your own machine.
      DEV_AUTH_TOOLS_ENABLED: "true"
      # "ollama" here (self-hosted, free, local) by default in this dev
      # compose file, per the user's explicit choice — set to "anthropic"
      # plus ANTHROPIC_API_KEY for real production-grade answers instead;
      # see internal/ai/llm's package doc for the interface both sit
      # behind. Leave LLM_PROVIDER unset entirely to disable both AI
      # endpoints (they answer 503 LLM_UNAVAILABLE) rather than fail to
      # start the whole service.
      LLM_PROVIDER: "ollama"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "llama3.2:3b"
      # ANTHROPIC_API_KEY: ""   # set this (and LLM_PROVIDER: "anthropic") to switch backends
    ports:
      - "8080:8080"

volumes:
  pgdata:
  opensearch-data:
  ollama-data:
