name: erp_pos_app
description: Phase 0/1 walking-skeleton POS client — login, barcode scan, cart, checkout.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2 # persists a per-device fingerprint for PIN-login device binding
  sqflite: ^2.3.3+1 # local offline-sync store: pending sales, cached catalog/stock
  path: ^1.9.0 # joins the sqflite database file path

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4+4 # runs real SQLite via FFI in tests — no Android/iOS device needed

flutter:
  uses-material-design: true
