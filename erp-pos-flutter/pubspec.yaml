name: erp_pos_app
description: Phase 0/1 walking-skeleton POS client — login, barcode scan, cart, checkout.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2 # persists a per-device fingerprint for PIN-login device binding
  sqflite: ^2.3.3+1 # local offline-sync store: pending sales, cached catalog/stock
  path: ^1.9.0 # joins the sqflite database file path

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4+4 # runs real SQLite via FFI in tests — no Android/iOS device needed

flutter:
  uses-material-design: true
  # Bundled, not fetched at runtime (no google_fonts): an offline terminal
  # must still render the design system's face. SIL OFL 1.1, see
  # assets/fonts/Geist-OFL.txt.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
