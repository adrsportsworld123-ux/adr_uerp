version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d   # auto-runs 001_schema.sql + 002_seed.sql on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  opensearch:
    image: opensearchproject/opensearch:2.17.0
    environment:
      - discovery.type=single-node
      # Local dev only — matches DEV_AUTH_TOOLS_ENABLED's philosophy below:
      # this compose file IS the dev environment, so the security plugin
      # (TLS, auth, initial admin password) is disabled rather than fought.
      # Never carry plugins.security.disabled=true into a real deployment.
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # 2.12+'s demo-config installer refuses to start without this set,
      # even though plugins.security.disabled=true means it's never
      # actually checked on any request — dev-only value, unused in practice.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Dev-Only-Passw0rd!
    ports:
      - "9200:9200"
    volumes:
      # Without this, every container recreation (an image rebuild, `docker
      # compose down`, `--force-recreate`, host reboot) starts OpenSearch
      # as a brand-new empty node — the products index gets recreated by
      # EnsureIndex on the next API boot, but with zero documents, so
      # search silently returns nothing until someone thinks to run
      # POST /search/reindex. Found live: exactly this happened after an
      # unrelated `api` container recreate outlived a separate opensearch
      # restart. main.go's startup backfill (search.BackfillAllTenants)
      # now covers the case where this volume is lost anyway, but keeping
      # the index warm across ordinary restarts is still the right default.
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      # erp_app, NOT app_user/POSTGRES_USER — app_user is a Postgres
      # superuser (that's what POSTGRES_USER always gets on the official
      # postgres image), and superusers unconditionally bypass row-level
      # security. The API must run as the restricted role migrations/004
      # creates, or every RLS policy in this schema is dead weight — see
      # that migration's header comment for how this was actually found
      # and confirmed live, not just reasoned about.
      DATABASE_DSN: "postgres://erp_app:erp_app_password@postgres:5432/erp?sslmode=disable"
      OPENSEARCH_URL: "http://opensearch:9200"
      JWT_SECRET: "dev-only-secret-change-me"
      # Enables POST /dev/hash-password and POST /dev/set-password — see
      # internal/authn/dev_handlers.go. On by default here because this
      # compose file IS your local dev environment. Delete this line (or
      # set it to "false") in any compose/deployment file that isn't
      # running solely on your own machine.
      DEV_AUTH_TOOLS_ENABLED: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
  opensearch-data:
